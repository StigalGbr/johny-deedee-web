<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misja Vertigo</title>
    <meta name="description" content="Odliczanie do Misji Vertigo">

    <!-- tlo siedzi w CSS, wiec bez tego przegladarka bierze sie za nie dopiero
         po sparsowaniu arkusza - przy pierwszym wejsciu bylo widac biale tlo -->
    <link rel="preload" as="image" href="pic/background.webp">

    <!-- GitHub Pages serwuje wszystko z max-age=600, wiec przegladarka trzyma
         stary arkusz i stare skrypty jeszcze przez dziesiec minut po wejsciu
         na swiezy index.html. Numer w adresie to lamie.
         PRZY KAZDEJ ZMIANIE style.css, lines.js, script.js albo game.js
         podbij ten numer we wszystkich czterech linijkach. -->
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <!-- przykrywa scene, dopoki wszystkie obrazki nie beda gotowe -->
    <div class="splash" id="splash" role="status" aria-label="Ładowanie">
        <div class="splash__dots"><span></span><span></span><span></span></div>
    </div>

    <canvas class="matrix" id="matrix" aria-hidden="true"></canvas>

    <main class="scene">

        <header class="hud">
            <button class="countdown" id="countdown" type="button" aria-live="polite"
                title="Kliknij, jeśli masz ochotę na konfetti">
                Pozostało 0h 0min 0 sek
            </button>
        </header>

        <div class="stage" id="stage">

            <div class="char char--johny">
                <!-- tresc dymkow jest podstawiana w script.js, ponizej wartosc domyslna -->
                <div class="bubble bubble--johny" id="bubble-johny" hidden>
                    Baciata? 💃 To jakiś nowy framework czy da się to zainstalować?
                </div>
                <button class="char__btn" type="button" data-char="johny" aria-label="Kliknij Johnny'ego Bravo">
                    <img class="char__img" src="pic/johny-bravo.webp" alt="Johnny Bravo" width="1024" height="1521"
                        fetchpriority="high">
                </button>

            </div>

            <div class="bubble bubble--finale" id="bubble-finale" hidden></div>

            <div class="char char--deedee">
                <div class="bubble bubble--deedee" id="bubble-deedee" hidden>
                    Cześć, jestem małym głodomorkiem 🥺 Masz pampucha?
                </div>
                <button class="char__btn" type="button" data-char="deedee" aria-label="Kliknij Dee Dee">
                    <img class="char__img" src="pic/dee-dee.webp" alt="Dee Dee" width="1024" height="1529"
                        fetchpriority="high">
                </button>
            </div>

        </div>

    </main>

    <!-- plan wieczoru -->
    <button class="plan-toggle" id="plan-toggle" type="button" aria-expanded="false" aria-controls="plan"
        aria-label="Plan wieczoru">
        📋<span class="plan-toggle__label">Plan wieczoru</span>
    </button>

    <!-- tryb gry -->
    <button class="game-toggle" id="game-toggle" type="button" aria-label="Gry">
        🎮<span class="game-toggle__label">Gry</span>
    </button>

    <div class="game" id="game" hidden>
        <div class="game__bar">
            <button class="game__back" id="game-back" type="button" hidden>◀ Menu</button>
            <span class="game__score" id="game-score"></span>
            <button class="game__close" id="game-close" type="button" aria-label="Zamknij grę">✕</button>
        </div>

        <div class="game__stack">
            <canvas class="game__canvas" id="game-canvas"></canvas>

            <div class="game__menu" id="game-menu">
                <h2 class="game__menu-title" id="game-menu-title"></h2>
                <div class="game__menu-list" id="game-menu-list"></div>
            </div>

            <div class="game__over" id="game-over" hidden>
                <p class="game__over-text" id="game-over-text"></p>
                <button class="game__again" id="game-again" type="button">Jeszcze raz</button>
            </div>
        </div>

        <p class="game__hint" id="game-hint"></p>
    </div>

    <aside class="plan" id="plan" hidden>
        <h2 class="plan__title">Plan wieczoru</h2>
        <ol class="plan__list" id="plan-list"></ol>
        <button class="plan__spider" id="spider-btn" type="button">
            🕷️ Obudź pająka
        </button>
        <p class="plan__hint">Na telefonie wystarczy potrząsnąć.</p>
    </aside>

    <!-- efekty -->
    <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
    <div class="fx" id="fx" aria-hidden="true"></div>

    <div class="final-count" id="final-count" hidden aria-hidden="true">
        <span class="final-count__number" id="final-count-number">60</span>
        <span class="final-count__label">sekund</span>
    </div>

    <script src="lines.js?v=2"></script>
    <script src="script.js?v=2"></script>
    <script src="game.js?v=2"></script>
</body>
</html>
